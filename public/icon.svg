<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8"/>
  
  <!-- Horseshoe Accent -->
  <path d="M 160 170 C 160 110, 352 110, 352 170 C 352 220, 320 280, 290 320 L 270 290 C 295 260, 316 215, 316 170 C 316 130, 196 130, 196 170 C 196 215, 217 260, 242 290 L 222 320 C 192 280, 160 220, 160 170 Z" fill="url(#goldGrad)" opacity="0.35"/>
  
  <!-- Stylized Horse Silhouette -->
  <path d="M 230 145 C 245 130, 275 130, 290 140 C 295 145, 310 142, 325 155 C 330 160, 318 175, 305 180 C 295 195, 280 200, 270 220 C 265 230, 260 250, 262 270 L 248 270 C 248 245, 255 225, 258 210 C 245 210, 235 195, 230 175 C 220 170, 210 160, 230 145 Z" fill="url(#goldGrad)"/>

  <!-- JM Monogram Core -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-4">JM</text>
  
  <!-- Subtle Subtitle in Badge -->
  <text x="256" y="430" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="8">JEYHBET</text>
</svg>
